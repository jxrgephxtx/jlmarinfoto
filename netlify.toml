[build]
  command = "npm run build"
  publish = "_site"

# Redirect Netlify subdomain to custom domain
[[redirects]]
  from = "https://poetic-llama-8e3716.netlify.app/*"
  to = "https://jlmarinfoto.com/:splat"
  status = 301
  force = true

# Legacy project URLs
[[redirects]]
  from = "/proyecto-*"
  to = "/proyectos/:splat"
  status = 301

# Security and SEO headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
